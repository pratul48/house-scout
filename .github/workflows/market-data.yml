name: market-data
on:
  schedule:
    - cron: '0 10 20 * *'   # monthly, after Zillow's mid-month update
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build-market.js', '.github/workflows/market-data.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-market.js
      - run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/zhvi
          git commit -m "Update Ohio home value index" || echo "no changes"
          git pull --rebase origin main && git push
