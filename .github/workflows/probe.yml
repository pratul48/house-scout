name: probe
on:
  push:
    branches: [live-test]
    paths: ['tools/**', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/probe.js > tools/probe-out.txt 2>&1 || true
      - run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add tools/probe-out.txt
          git commit -m "probe output [skip ci]" || true
          git push
